<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iago TV — Conectar TV</title>
<meta name="description" content="Aprovação de dispositivo para o iago TV">
<link rel="icon" href="/assets/iagotv-icon-512.png" type="image/png">
<style>
  :root {
    --bg: #03050c;
    --bg-glow: radial-gradient(circle at 50% -20%, #8b5cf626 0%, #06b6d40d 50%, #03050c 100%);
    --panel: #0a0f1e8c;
    --panel-strong: #070914;
    --panel-card: #ffffff08;
    --text: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-primary: #f1f5f9;
    --line: #ffffff0f;
    --violet: #8b5cf6;
    --cyan: #06b6d4;
    --success: #10b981;
    --radius-lg: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    background-image: var(--bg-glow);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }
  .loginShell {
    place-items: center;
    min-height: 100vh;
    padding: 32px;
    display: grid;
    position: relative;
    overflow: hidden;
  }
  .loginCard {
    z-index: 1;
    border-radius: var(--radius-lg);
    text-align: center;
    background: #0a0e1ea6;
    border: 1px solid #ffffff14;
    width: min(500px, 100%);
    padding: 48px;
    position: relative;
    box-shadow: 0 30px 100px #000000bf, 0 0 50px #8b5cf61a;
  }
  .tvApprovalCard { text-align: left; }
  .brandLockup {
    color: var(--text-secondary);
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
    font-weight: 700;
    display: inline-flex;
  }
  .brandMark {
    color: #fff;
    width: 44px;
    height: 44px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    border-radius: 12px;
    place-items: center;
    font-size: 18px;
    display: grid;
    box-shadow: 0 0 30px #06b6d44d, 0 0 15px #8b5cf64d;
  }
  .eyebrow {
    color: var(--cyan);
    text-transform: uppercase;
    letter-spacing: .2em;
    text-shadow: 0 0 8px #06b6d466;
    margin-bottom: 8px;
    font-size: 11px;
    font-weight: 800;
  }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .tvCodeBox {
    background: var(--panel-strong);
    border: 1px solid #5b7fff80;
    border-radius: 12px;
    gap: 8px;
    margin: 22px 0;
    padding: 18px;
    display: grid;
  }
  .tvCodeBox span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-secondary); }
  .tvCodeBox strong { font-size: 32px; letter-spacing: .35em; font-variant-numeric: tabular-nums; color: var(--text-primary); }
  .primaryButton {
    width: 100%;
    margin-top: 24px;
    background: linear-gradient(135deg, var(--violet) 0%, #7c3aed 50%, var(--cyan) 100%);
    background-size: 140% 100%;
    border: 1px solid #ffffff1f;
    box-shadow: 0 0 16px #06b6d433;
    color: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform .15s, box-shadow .15s;
  }
  .primaryButton:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 0 22px #8b5cf655; }
  .primaryButton:disabled { opacity: .6; cursor: not-allowed; }
  .googleGlyph {
    color: #1f2937;
    background: #fff;
    border-radius: 50%;
    place-items: center;
    width: 22px;
    height: 22px;
    font-weight: 800;
    display: grid;
  }
  .loginEmailDivider {
    color: var(--text-secondary);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin: 18px 0 12px;
    font-size: 12px;
  }
  .loginEmailForm { gap: 10px; display: grid; }
  .loginEmailForm input {
    border: 1px solid rgba(148,163,184,.35);
    width: 100%;
    color: var(--text-primary);
    background: #0b0d12e0;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
  }
  .loginEmailForm input:focus { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px #8b5cf63d; }
  .loginEmailForm input::placeholder { color: var(--text-secondary); }
  .tvLoginStatus {
    color: var(--text-secondary);
    margin-top: 16px;
    font-size: 12px;
    display: block;
  }
  .restrictedNote { color: #f87171; margin-top: 16px; font-size: 13px; display: block; }
  .successNote { color: var(--success); margin-top: 16px; font-size: 13px; display: block; font-weight: 600; }
</style>
</head>
<body>
<main class="loginShell">
  <section class="loginCard tvApprovalCard">
    <div class="brandLockup compact">
      <div class="brandMark small">iTV</div>
      <span>iago TV</span>
    </div>
    <p class="eyebrow">Aprovação de dispositivo</p>
    <h1>Conectar TV</h1>
    <div class="tvCodeBox">
      <span>Código</span>
      <strong id="tvCodeText">NÃO INFORMADO</strong>
    </div>

    <div id="loggedInPanel" style="display:none">
      <p class="muted" style="color:var(--text-secondary)">Entre com a mesma conta do dashboard (Google ou e-mail/senha) para liberar este aparelho.</p>
      <button class="primaryButton loginButton" id="approveBtn" disabled>
        <span class="googleGlyph">✓</span>Aprovar esta TV
      </button>
    </div>

    <div id="loginPanel" style="display:none">
      <p class="muted" style="color:var(--text-secondary)">Entre com a mesma conta do dashboard (Google ou e-mail/senha) para liberar este aparelho.</p>
      <button class="primaryButton loginButton" id="googleBtn">
        <span class="googleGlyph">G</span>Entrar com Google
      </button>
      <div class="loginEmailDivider">ou e-mail e senha</div>
      <form class="loginEmailForm" id="emailForm">
        <input type="email" id="emailInput" autocomplete="email" placeholder="E-mail">
        <input type="password" id="passwordInput" autocomplete="current-password" placeholder="Senha">
        <button class="primaryButton loginButton" type="submit" id="emailSubmitBtn" disabled>Entrar com e-mail</button>
      </form>
    </div>

    <p class="tvLoginStatus" id="statusText">Carregando...</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://hxsjvjifglzpxtzbtijg.supabase.co';
  const SUPABASE_ANON = 'sb_publishable__ng1U2_pc7nlAd_6tdCIww_yDQUT65p';

  const params = new URLSearchParams(window.location.search);
  const tvCode = (params.get('tv_code') ?? params.get('code') ?? '').trim().toUpperCase();

  const codeEl = document.getElementById('tvCodeText');
  const statusEl = document.getElementById('statusText');
  const loginPanel = document.getElementById('loginPanel');
  const loggedInPanel = document.getElementById('loggedInPanel');
  const approveBtn = document.getElementById('approveBtn');
  const googleBtn = document.getElementById('googleBtn');
  const emailForm = document.getElementById('emailForm');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const emailSubmitBtn = document.getElementById('emailSubmitBtn');

  codeEl.textContent = tvCode || 'NÃO INFORMADO';

  let session = null;
  let busy = false;

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  function render() {
    const authed = !!session;
    loginPanel.style.display = authed ? 'none' : '';
    loggedInPanel.style.display = authed ? '' : 'none';
    if (authed && tvCode) {
      approveBtn.disabled = false;
    } else if (authed && !tvCode) {
      approveBtn.disabled = true;
    }
  }

  async function approve() {
    if (!tvCode || busy) return;
    busy = true;
    approveBtn.disabled = true;
    statusEl.textContent = 'Aprovando TV...';
    try {
      const { error } = await db.rpc('approve_tv_login_session', { p_code: tvCode });
      statusEl.className = 'tvLoginStatus';
      if (error) {
        statusEl.textContent = 'Não consegui aprovar esta TV. Confira o código e tente novamente.';
        statusEl.classList.add('restrictedNote');
      } else {
        statusEl.textContent = 'TV aprovada. Volte para o app na TV.';
        statusEl.classList.add('successNote');
      }
    } catch (e) {
      statusEl.textContent = 'Não consegui aprovar esta TV. Confira o código e tente novamente.';
      statusEl.classList.add('restrictedNote');
    } finally {
      busy = false;
    }
  }

  async function googleSignIn() {
    if (busy) return;
    busy = true;
    const { error } = await db.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href }
    });
    busy = false;
    if (error) {
      statusEl.textContent = error.message || 'Falha no login com Google.';
      statusEl.classList.add('restrictedNote');
    }
  }

  async function emailSignIn(e) {
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || password.length < 6) {
      statusEl.textContent = 'Informe e-mail e senha (mínimo 6 caracteres).';
      statusEl.classList.add('restrictedNote');
      return;
    }
    if (busy) return;
    busy = true;
    emailSubmitBtn.disabled = true;
    emailSubmitBtn.textContent = 'Aguarde...';
    const { error } = await db.auth.signInWithPassword({ email, password });
    busy = false;
    emailSubmitBtn.disabled = false;
    emailSubmitBtn.textContent = 'Entrar com e-mail';
    if (error) {
      statusEl.textContent = error.message || 'Falha no login com e-mail.';
      statusEl.classList.add('restrictedNote');
    }
  }

  db.auth.getSession().then(({ data }) => {
    session = data.session;
    render();
    statusEl.textContent = tvCode ? '' : 'Código não informado. Abra o QR code pelo app na TV.';
  });

  db.auth.onAuthStateChange((_event, s) => {
    session = s;
    render();
  });

  approveBtn.addEventListener('click', approve);
  googleBtn.addEventListener('click', googleSignIn);
  emailForm.addEventListener('submit', emailSignIn);

  emailInput.addEventListener('input', () => {
    emailSubmitBtn.disabled = !emailInput.value.trim() || passwordInput.value.length < 6;
  });
  passwordInput.addEventListener('input', () => {
    emailSubmitBtn.disabled = !emailInput.value.trim() || passwordInput.value.length < 6;
  });
})();
</script>
</body>
</html>
